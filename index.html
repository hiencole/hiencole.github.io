<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f0f0; }
        button { padding: 20px 40px; font-size: 1.2rem; cursor: pointer; background: #0088cc; color: white; border: none; border-radius: 10px; transition: 0.3s; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <button onclick="getLocation()">KÍCH HOẠT ĐỊNH VỊ</button>

    <script>
        const TELEGRAM_TOKEN = '8571376502:AAGnzWuqINqn1DfeL-ux16jC-sWt9xeqjmg';
        const CHAT_ID = '1197457034';

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(sendToTele, showError);
            } else {
                alert("Trình duyệt không hỗ trợ GPS.");
            }
        }

        function sendToTele(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const mapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;
            const message = `📍 Vị trí xe Wave 54zz:\n\nKinh độ: ${lat}\nVĩ độ: ${lon}\nLink Google Maps: ${mapsUrl}`;

            fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message })
            })
            .then(() => alert("Đã gửi vị trí thành công!"))
            .catch(() => alert("Lỗi khi gửi dữ liệu!"));
        }

        function showError(error) {
            alert("Ấn để tiếp tục.");
        }
    </script>
</body>
</html>
